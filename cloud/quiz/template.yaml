# OWNER: B (Spec B — task B10, P1). Deploy: `sam build && sam deploy` (settings in samconfig.toml).
# Topics in, questions out, nothing stored. Throttled hard: every call is a Bedrock bill.
AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Toll quiz generation — topics in, questions out, nothing stored.

Parameters:
  ModelId:
    Type: String
    # anthropic.claude-sonnet-5-5 is listed in us-east-2 but not invocable on this account (AccessDenied);
    # Sonnet 4.6 via the US cross-region inference profile is. Swap here when 5.5 opens up.
    Default: us.anthropic.claude-sonnet-4-6

Resources:
  QuizHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      DefaultRouteSettings:
        ThrottlingBurstLimit: 5
        ThrottlingRateLimit: 2
      CorsConfiguration:
        AllowOrigins: ['*']
        AllowMethods: [POST]
        AllowHeaders: [content-type]
        MaxAge: 600

  QuizApi:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs22.x
      Architectures: [arm64]
      MemorySize: 256
      Handler: index.handler
      CodeUri: src/
      Timeout: 29 # API Gateway's HTTP API gives up at 30 s
      Environment:
        Variables:
          MODEL_ID: !Ref ModelId
      Policies:
        - Statement:
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource:
                - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*
                - arn:aws:bedrock:*::foundation-model/anthropic.*
      Events:
        Generate: { Type: HttpApi, Properties: { ApiId: !Ref QuizHttpApi, Path: /quiz, Method: post } }

  QuizApiLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${QuizApi}
      RetentionInDays: 7

Outputs:
  ApiUrl:
    Description: Base URL for the phone app (QUIZ_API_URL in src/day/quizConfig.ts).
    Value: !Sub https://${QuizHttpApi}.execute-api.${AWS::Region}.amazonaws.com
